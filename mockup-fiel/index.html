<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vecton · telas originais em Clear</title><style>
*{box-sizing:border-box}body{margin:0;font:12px "Segoe UI",sans-serif;color:#243044;background:#fff}header{height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #dde3ec}header strong{font-weight:600}header span{color:#667085;font-size:11px}.spacer{flex:1}select,button{font:inherit;border:1px solid #dce1e9;border-radius:6px;background:#fff;color:#344054;padding:5px 10px;cursor:pointer}button[aria-pressed=true]{color:#2459d9;background:#edf2ff;border-color:#b6c8fa}button:focus-visible,select:focus-visible{outline:2px solid #2563eb;outline-offset:2px}iframe{border:0;width:100%;height:calc(100dvh - 44px);display:block}@media(max-width:650px){header{padding:0 8px;gap:6px}header span,header strong{display:none}select{min-width:0;max-width:200px}button{padding:5px 8px}}
</style></head><body><header><strong>Vecton · avaliação visual</strong><span>Mesmas telas e componentes · dados de exemplo</span><div class="spacer"></div><select id="screens" aria-label="Abrir tela original"><option value="dashboard">Dashboard</option></select><button id="clear" aria-pressed="true">Clear</button><button id="dark" aria-pressed="false">Dark original</button></header><iframe id="preview" title="Vecton original com tema selecionado" src="app.html"></iframe><script>
const frame=document.getElementById('preview');let theme='clear';
function changeTheme(value){theme=value;frame.contentWindow.postMessage({type:'vecton-preview-theme',theme},location.origin);document.querySelectorAll('header button').forEach(b=>b.setAttribute('aria-pressed',String(b.id===theme)));}
document.getElementById('clear').onclick=()=>changeTheme('clear');document.getElementById('dark').onclick=()=>changeTheme('dark');
document.getElementById('screens').onchange=e=>frame.contentWindow.postMessage({type:'vecton-preview-go',id:e.target.value},location.origin);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data.type==='vecton-preview-ready'){const select=document.getElementById('screens');select.replaceChildren(...e.data.screens.map(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.title;return o;}));changeTheme(theme);}if(e.data.type==='vecton-preview-theme-current'){theme=e.data.theme;document.querySelectorAll('header button').forEach(b=>b.setAttribute('aria-pressed',String(b.id===theme)));}if(e.data.type==='vecton-preview-current')document.getElementById('screens').value=e.data.id;});
</script></body></html>
